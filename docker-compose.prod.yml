services:
  postgres:
    image: postgres:16-alpine
    container_name: al-mazo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-al_mazo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-al_mazo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: al-mazo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: al-mazo-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-al_mazo_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGIN: https://almazo.aguilucho.ar
      AUTH_SECRET: ${AUTH_SECRET}
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.almazo-server.rule=Host(`almazo.aguilucho.ar`) && (PathPrefix(`/api`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.almazo-server.priority=100"
      - "traefik.http.routers.almazo-server.entrypoints=web,websecure"
      - "traefik.http.routers.almazo-server.tls=true"
      - "traefik.http.routers.almazo-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.almazo-server.loadbalancer.server.port=3000"

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: al-mazo-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - internal
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.almazo-client.rule=Host(`almazo.aguilucho.ar`)"
      - "traefik.http.routers.almazo-client.priority=10"
      - "traefik.http.routers.almazo-client.entrypoints=web,websecure"
      - "traefik.http.routers.almazo-client.tls=true"
      - "traefik.http.routers.almazo-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.almazo-client.loadbalancer.server.port=3000"

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
